<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h2>Application Form</h2>
        <label for="username" style="background-color: brown;">Username</label>
        <input type="text" name="username" id="username"><br><br>

        <span>Martial status</span>
        <input type="radio" name="status" id="married" value="married">
        <label for="married">Married</label>
        <input type="radio" name="status" id="unmarried" value="unmarried">
        <label for="unmarried">Unmarried</label><br><br>

        <span>Programming Skill</span>
        <input type="checkbox" name="skill" id="java" value="java">
        <label for="java">Java</label>
        <input type="checkbox" name="skill" id="python" value="python">
        <label for="java">python</label>
        <input type="checkbox" name="skill" id="c++" value="C++">
        <label for="c++">C++</label>
        <input type="checkbox" name="skill" id="ruby" value="Ruby">
        <label for="ruby">Ruby</label><br><br>

        <label for="dob">Date of Birth</label>
        <input type="date" name="dob" id="dob"><br><br>

        <label for="age">Age</label>
        <input type="number" name="age" id="age"><br><br>

        <label for="resume">Resume</label>
        <input type="file" name="resume" id="resume"><br><br>

        <label for="linkedin">Enter your Linkedin URL</label>
        <input type="url" name="linkedin" id="linkedin"><br><br>

        <span>Rate your skills</span><br>
        <label for="htmlratings">HTML</label>
        <span>1</span>
        <input type="range" name="htmlratings" id="htmlratings">
        <span>100</span><br><br>

        <button>Submit</button>

        
    </form>
</body>
</html>
