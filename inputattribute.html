<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" autocomplete="off" novalidate>
    <input type="text" name="username" id="username" minlength="3" value="Jhon Doe" autofocus="on" style="color: rgb(255, 0, 38);" size="20"><br><br>

    <label for="phone"  >Phone*</label>
    <input type="tel" name="phone" id="phone" maxlength="10" required  autocomplete="off" ><br><br>

    <span>1</span>
    <input type="range" name="ratings" id="ratings" min="1" max="5"  step="3">
    <span>5</span><br><br>

    <label for="">Enter the date</label>
    <input type="date" name="date" id="date" min="2007-04-10" max="2027-04-10"><br><br>

    <label for="password">Password</label>
    <input type="text" name="password" id="password" pattern="*[*.!@ $%^&(){}[]:;<>,.?/~_+-=|\]" title="user please enter a password which contains number and a special character"><br><br>

    <input type="text" name="email" id="email"  placeholder="Enter you email" multiple=""><br><br>

    <input type="file" name="file" id="file" multiple><br><br>

    <input type="text" name="username1" id="" value="Pavithra" readonly><br><br>

    <input type="text" name="username2" id="" value="Anusha" disabled><br><br>
    <button>Submit</button>
</form>
</body>
</html>
